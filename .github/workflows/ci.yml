name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Lint
        uses: ./.github/actions/lint

  unit:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Unit
        uses: ./.github/actions/unit

  # One matrix cell per scenario (and, for the media scenario, per media
  # preset). Runs after lint and unit pass; every cell then runs to the
  # end regardless of the others' outcome (fail-fast is off), and each
  # cell uploads its own log and result so e2e-required can report on
  # all of them even when some fail.
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - lint
      - unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: media, media: dvd+r, name: media/dvd+r, slug: media-dvd-r }
          - { scenario: media, media: bd25, name: media/bd25, slug: media-bd25 }
          - { scenario: media, media: bd25-forced-10g, name: media/bd25-forced-10g, slug: media-bd25-forced-10g }
          - { scenario: corrupt-heal, media: '', name: corrupt-heal, slug: corrupt-heal }
          - { scenario: corrupt-parity, media: '', name: corrupt-parity, slug: corrupt-parity }
          - { scenario: corrupt-max, media: '', name: corrupt-max, slug: corrupt-max }
          - { scenario: corrupt-over, media: '', name: corrupt-over, slug: corrupt-over }
          - { scenario: cli, media: '', name: cli, slug: cli }
          - { scenario: chain, order: dvd-bd25-bd10, name: chain/dvd-bd25-bd10, slug: chain-dvd-bd25-bd10 }
          - { scenario: chain, order: bd25-bd10-dvd, name: chain/bd25-bd10-dvd, slug: chain-bd25-bd10-dvd }
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: E2E
        uses: ./.github/actions/e2e
        with:
          scenario: ${{ matrix.scenario }}
          media: ${{ matrix.media }}
          order: ${{ matrix.order }}
          go-test-timeout: ${{ matrix.scenario == 'chain' && '170m' || '30m' }}
          cell-name: ${{ matrix.name }}
          artifact-name: e2e-result-${{ matrix.slug }}

  # One stable check the branch ruleset can require in place of every
  # e2e cell, so adding or dropping a cell never touches branch
  # protection. e2e already needs lint and unit, so needing e2e alone
  # covers all three. Downloads every e2e cell's result first and prints
  # a summary table, so the run stays legible even when several cells
  # failed, then evaluates e2e's result.
  e2e-required:
    name: E2E
    runs-on: ubuntu-latest
    needs:
      - e2e
    if: always()
    steps:
      - name: Download e2e cell results
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-result-*
          path: e2e-results
          merge-multiple: false

      - name: Summarize e2e cell results
        if: always()
        run: |
          {
            echo "## E2E cell results"
            echo
            echo "| cell | result | time |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for f in e2e-results/*/result.txt; do
            read -r cell status seconds < "$f"
            echo "| $cell | $status | $seconds |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: All required jobs passed
        run: '[ "${{ needs.e2e.result }}" = "success" ]'
