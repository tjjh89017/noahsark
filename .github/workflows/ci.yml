name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decides once whether this push or pull request touches anything but
  # Markdown, docs/**, or LICENSE. Test and the e2e matrix read its
  # output and skip themselves entirely for a docs-only change; Lint
  # reads it too, but only to skip its golangci-lint step, since it
  # still owes a docs-only pull request the Markdown link check. So a
  # documentation pull request does not wait 30 to 40 minutes for tests
  # that cannot be affected.
  decide:
    name: Decide
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.diff.outputs.code_changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether code changed
        id: diff
        shell: bash
        run: |
          # Default to "code changed" so any range we cannot compute
          # (first push, force push, missing base) runs the full suite.
          code_changed=true

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            diff_range="$base...$head"
          else
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            diff_range="$base..$head"
            case "$base" in
              ""|0000000000000000000000000000000000000000)
                diff_range=""
                ;;
            esac
          fi

          changed_files=""
          if [ -n "$diff_range" ] && changed_files="$(git diff --name-only "$diff_range" 2>/dev/null)"; then
            docs_only=true
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                *.md|docs/*|LICENSE) ;;
                *) docs_only=false ;;
              esac
            done <<< "$changed_files"
            if [ "$docs_only" = "true" ]; then
              code_changed=false
            fi
          fi

          echo "Changed files:"
          echo "${changed_files:-<diff unavailable, treating as code changed>}"
          echo "code_changed=$code_changed"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

  # Runs the Markdown link check and, when code changed, golangci-lint.
  # Runs whenever decide found code changed (any event) or this is a
  # pull request (so a documents-only pull request still gets the link
  # check, in seconds, without waiting on golangci-lint or the e2e
  # matrix); a documents-only push to main runs neither and is skipped.
  lint:
    name: Lint
    needs: decide
    if: needs.decide.outputs.code_changed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Lint
        uses: ./.github/actions/lint
        with:
          code-changed: ${{ needs.decide.outputs.code_changed }}

  unit:
    name: Test
    needs: decide
    if: needs.decide.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Unit
        uses: ./.github/actions/unit

  # One matrix cell per scenario. Seven cells cover what 14 used to:
  # media/dvd+r also runs cli and iso in sequence (extras), and fec runs
  # the four corrupt-* checks in sequence, since FEC is optional and off
  # by default and does not need a cell of its own for each corruption
  # pattern. Only one chain order runs; both orders cross the same three
  # media and prove the same things, so the second added wall time
  # without new coverage. Runs after lint and unit pass; every cell then
  # runs to the end regardless of the others' outcome (fail-fast is
  # off), and each cell uploads its own log and result so e2e-required
  # can report on all of them even when some fail.
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - decide
      - lint
      - unit
    if: needs.decide.outputs.code_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: media, media: dvd+r, extras: 'cli,iso', name: media/dvd+r, slug: media-dvd-r }
          - { scenario: media, media: bd25-forced-10g, extras: '', name: media/bd25-forced-10g, slug: media-bd25-forced-10g }
          - { scenario: chain, order: dvd-bd25-bd10, extras: '', name: chain/dvd-bd25-bd10, slug: chain-dvd-bd25-bd10 }
          - { scenario: lowmem, media: '', extras: '', name: lowmem, slug: lowmem }
          - { scenario: incremental, media: '', extras: '', name: incremental, slug: incremental }
          - { scenario: rebuild, media: '', extras: '', name: rebuild, slug: rebuild }
          - { scenario: fec, media: '', extras: '', name: fec, slug: fec }
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: E2E
        uses: ./.github/actions/e2e
        with:
          scenario: ${{ matrix.scenario }}
          media: ${{ matrix.media }}
          order: ${{ matrix.order }}
          extras: ${{ matrix.extras }}
          go-test-timeout: ${{ matrix.scenario == 'chain' && '170m' || '30m' }}
          mem-limit-mb: ${{ matrix.scenario == 'lowmem' && '512' || '' }}
          cell-name: ${{ matrix.name }}
          artifact-name: e2e-result-${{ matrix.slug }}

  # One stable check the branch ruleset can require in place of every
  # e2e cell, lint, and unit, so adding or dropping a cell never touches
  # branch protection. Always runs, so it can also gate a docs-only
  # change where decide skipped lint, unit, and e2e on purpose. Passes
  # when decide succeeded and each of lint, unit, e2e either succeeded
  # or was skipped; fails on any failure, cancellation, or on decide
  # itself failing (which leaves the others skipped for the wrong
  # reason). Downloads every e2e cell's result first and prints a
  # summary table, so the run stays legible even when several cells
  # failed.
  e2e-required:
    name: E2E
    runs-on: ubuntu-latest
    needs:
      - decide
      - lint
      - unit
      - e2e
    if: always()
    steps:
      - name: Download e2e cell results
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-result-*
          path: e2e-results
          merge-multiple: false

      - name: Summarize e2e cell results
        if: always()
        run: |
          {
            echo "## E2E cell results"
            echo
            echo "| cell | result | time |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for f in e2e-results/*/result.txt; do
            read -r cell status seconds < "$f"
            echo "| $cell | $status | $seconds |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: All required jobs passed
        run: |
          decide="${{ needs.decide.result }}"
          lint="${{ needs.lint.result }}"
          unit="${{ needs.unit.result }}"
          e2e="${{ needs.e2e.result }}"
          echo "decide=$decide lint=$lint unit=$unit e2e=$e2e"

          if [ "$decide" != "success" ]; then
            echo "decide did not succeed"
            exit 1
          fi

          for result in "$lint" "$unit" "$e2e"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "a required job did not pass: $result"
                exit 1
                ;;
            esac
          done
