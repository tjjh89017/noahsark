name: 'Unit'
description: >
  Runs the unit test suite: a gofmt check, go vet, go test over every
  package, and the tests of the reference decoder, without the disc e2e
  suite. Every workflow that needs
  the unit suite calls this action instead of repeating its steps.
runs:
  using: 'composite'
  steps:
    - name: gofmt check
      shell: bash
      run: |
        fmt_out="$(gofmt -l .)"
        if [ -n "$fmt_out" ]; then
          echo "gofmt found unformatted files:"
          echo "$fmt_out"
          exit 1
        fi

    - name: go vet
      shell: bash
      run: go vet ./...

    - name: go test
      shell: bash
      run: go test ./...

    - name: reference decoder tests
      shell: bash
      run: python3 -m unittest reference/decoder_test.py
