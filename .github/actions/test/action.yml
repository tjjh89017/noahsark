name: 'Test'
description: >
  Runs the Go test suite: a gofmt check, go vet, and go test. Every
  workflow that tests Go code calls this action instead of repeating its
  steps.
runs:
  using: 'composite'
  steps:
    - name: gofmt check
      shell: bash
      run: |
        fmt_out="$(gofmt -l .)"
        if [ -n "$fmt_out" ]; then
          echo "gofmt found unformatted files:"
          echo "$fmt_out"
          exit 1
        fi

    - name: go vet
      shell: bash
      run: go vet ./...

    - name: go test
      shell: bash
      run: go test ./...

    - name: Install udftools
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y udftools

    - name: Check mkudffs version
      shell: bash
      run: |
        # mkudffs has no --version option; it prints its "mkudffs from
        # udftools X.Y" banner and a usage message, then exits nonzero,
        # when run with no device argument.
        out="$(mkudffs 2>&1 || true)"
        echo "$out"
        ver="$(echo "$out" | grep -oE 'udftools [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+' | head -1)"
        major="${ver%%.*}"
        minor="${ver##*.}"
        if [ -z "$ver" ] || [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 3 ]; }; then
          echo "mkudffs version $ver is older than the required 2.3"
          exit 1
        fi

    - name: go test (image build, under CI)
      shell: bash
      env:
        NOAHSARK_CI: '1'
      run: go test ./internal/image/...

    - name: Build a fixture disc and image
      shell: bash
      run: |
        mkdir -p "${{ runner.temp }}/noahsark-ci"
        go run ./internal/image/cmd/ci-fixture "${{ runner.temp }}/noahsark-ci" > "${{ runner.temp }}/noahsark-ci/paths.txt"
        cat "${{ runner.temp }}/noahsark-ci/paths.txt"

    - name: Loop-mount the image and read it back
      shell: bash
      run: |
        WORK="${{ runner.temp }}/noahsark-ci"
        TREE_DIR="$(sed -n '1p' "$WORK/paths.txt")"
        IMAGE="$(sed -n '2p' "$WORK/paths.txt")"
        MNT="$WORK/mnt"

        # Corrupt-and-heal below writes back into the mount as the
        # runner user, not root.
        "${{ github.action_path }}/mount-populate.sh" "$IMAGE" "$TREE_DIR" "$MNT"

        go run ./internal/image/cmd/ci-list "$MNT" > "$WORK/go-list.txt"
        python3 reference/decoder.py summary "$MNT"
        python3 reference/decoder.py list "$MNT" --snapshot LATEST > "$WORK/py-list.txt"
        python3 reference/decoder.py verify "$MNT"

        grep -v '^#' "$WORK/go-list.txt" | sort > "$WORK/go-paths.sorted.txt"
        grep -v '^#' "$WORK/py-list.txt" | awk '{print $NF}' | sort > "$WORK/py-paths.sorted.txt"
        if ! diff -u "$WORK/py-paths.sorted.txt" "$WORK/go-paths.sorted.txt"; then
          echo "decoder.py and the Go reader disagree on the snapshot listing"
          "${{ github.action_path }}/umount-if-mounted.sh" "$MNT"
          exit 1
        fi

    - name: Delete the staging directory before restore
      shell: bash
      run: |
        # internal/restore's Restore must need only the disc image, never
        # the staging directory Commit wrote objects into. Deleting it
        # here, before restoring, is the proof.
        WORK="${{ runner.temp }}/noahsark-ci"
        STAGING="$WORK/staging"
        if [ ! -d "$STAGING" ]; then
          echo "expected a staging directory at $STAGING before deleting it"
          exit 1
        fi
        rm -rf "$STAGING"

    - name: Restore, corrupt, heal, restore, and compare against the source
      shell: bash
      run: |
        WORK="${{ runner.temp }}/noahsark-ci"
        SRC="$(sed -n '3p' "$WORK/paths.txt")"
        MNT="$WORK/mnt"

        # Restore from the untouched image and compare with the source
        # fixture ci-fixture committed. Restore recreates the source's own
        # absolute path under its output directory.
        go run ./internal/restore/cmd/ci-restore "$MNT" "$WORK/restore-before"
        diff -rq "$WORK/restore-before$SRC" "$SRC"

        # Corrupt two data blocks of the mounted image directly: one byte
        # each inside README.txt and FORMAT.txt's on-disc bytes, found
        # through the same stream layout Heal uses. Column 0 and 1 are
        # INDEX.bin itself and are never corrupted here: Heal needs a
        # readable INDEX.bin to find anything else to repair.
        go run ./internal/restore/cmd/ci-corrupt "$MNT" 3:0 6:0

        go run ./internal/restore/cmd/ci-heal "$MNT"

        go run ./internal/restore/cmd/ci-restore "$MNT" "$WORK/restore-after"
        diff -rq "$WORK/restore-after$SRC" "$SRC"

    - name: Unmount the image
      if: always()
      shell: bash
      run: "${{ github.action_path }}/umount-if-mounted.sh \"${{ runner.temp }}/noahsark-ci/mnt\""

    - name: Build the noahsark binary
      shell: bash
      run: go build -o "${{ runner.temp }}/noahsark-ci/noahsark" ./cmd/noahsark

    - name: Run init, commit, pack and image build through the binary
      shell: bash
      run: |
        WORK="${{ runner.temp }}/noahsark-ci"
        BIN="$WORK/noahsark"
        SRC="$(sed -n '3p' "$WORK/paths.txt")"
        REPO="$WORK/cli-repo"
        TREE="$WORK/cli-tree"
        IMAGE="$WORK/cli-run.img"

        "$BIN" init --repo="$REPO" --capacity=64MiB
        "$BIN" commit --repo="$REPO" "$SRC" | tee "$WORK/cli-commit.txt"
        SNAP="$(awk '/^snapshot /{print $2}' "$WORK/cli-commit.txt")"
        echo "$SNAP" > "$WORK/cli-snapshot.txt"

        "$BIN" pack --repo="$REPO" --capacity=64MiB --out="$TREE"
        "$BIN" image build --out="$IMAGE" --capacity=64MiB "$TREE"

    - name: Mount the binary-built image, verify and restore through the binary
      shell: bash
      run: |
        WORK="${{ runner.temp }}/noahsark-ci"
        BIN="$WORK/noahsark"
        SRC="$(sed -n '3p' "$WORK/paths.txt")"
        SNAP="$(cat "$WORK/cli-snapshot.txt")"
        TREE="$WORK/cli-tree"
        IMAGE="$WORK/cli-run.img"
        MNT="$WORK/cli-mnt"

        "${{ github.action_path }}/mount-populate.sh" "$IMAGE" "$TREE" "$MNT"

        "$BIN" verify --image="$MNT"
        "$BIN" restore "$MNT" "$SNAP" "$WORK/cli-restored"
        diff -rq "$WORK/cli-restored$SRC" "$SRC"

    - name: Unmount the binary-built image
      if: always()
      shell: bash
      run: "${{ github.action_path }}/umount-if-mounted.sh \"${{ runner.temp }}/noahsark-ci/cli-mnt\""

    - name: "Capacity matrix: DVD, BD, and BD forced to a smaller limit"
      shell: bash
      run: |
        bash "${{ github.action_path }}/capacity-matrix.sh" \
          "${{ github.action_path }}" \
          "${{ runner.temp }}/noahsark-ci-capacity" \
          "${{ runner.temp }}/noahsark-ci/noahsark"

    - name: Unmount any capacity matrix image left mounted
      if: always()
      shell: bash
      run: |
        for m in cap1-mnt cap2-mnt cap3-mnt; do
          "${{ github.action_path }}/umount-if-mounted.sh" "${{ runner.temp }}/noahsark-ci-capacity/$m"
        done
