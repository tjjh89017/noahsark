name: 'E2E'
description: >
  Runs one disc e2e scenario (and, for the media scenario, one media
  preset): installs udftools, checks the mkudffs version, builds the
  helper commands and the noahsark binary, and runs test/e2e/disc under
  sudo with NOAHSARK_E2E set. Every e2e matrix cell calls this action
  instead of repeating its steps. Uploads the cell's log and result line
  as an artifact named after cell-name, whether the cell passed or
  failed.
inputs:
  scenario:
    description: 'NOAHSARK_E2E_SCENARIO value'
    required: true
  media:
    description: 'NOAHSARK_E2E_MEDIA value; empty for a scenario that does not read it'
    required: false
    default: ''
  order:
    description: 'NOAHSARK_E2E_ORDER value; empty for a scenario that does not read it'
    required: false
    default: ''
  extras:
    description: >
      NOAHSARK_E2E_EXTRAS value: a comma-separated list of extra
      scenarios run.sh runs in sequence after the primary scenario, e.g.
      'cli,iso' folded into the media/dvd+r cell. Empty for a cell with
      no extras.
    required: false
    default: ''
  go-test-timeout:
    description: 'go test -timeout value; the chain scenario needs far longer than every other cell'
    required: false
    default: '30m'
  mem-limit-mb:
    description: >
      Caps the sudo'd go test process at this many MiB of address space,
      to prove the low-RAM rule against a real cell instead of only unit
      tests. Empty (the default) runs unconstrained. Tries systemd-run
      --scope first, falls back to prlimit --as if that is not usable on
      the runner.
    required: false
    default: ''
  cell-name:
    description: 'Matrix cell name, used for the result line'
    required: true
  artifact-name:
    description: 'Artifact name for this cell''s log and result, e.g. e2e-result-media-dvd-r; must not contain a slash'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Free disk space for large media fixtures
      shell: bash
      run: |
        # The media scenario writes fixture data close to a real disc's
        # capacity; a standard runner's default free space is not enough
        # headroom for that at the BD presets. Remove large preinstalled
        # toolchains this workflow never uses.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL || true
        df -h /

    - name: Install udftools and genisoimage
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y udftools genisoimage

    - name: Check mkudffs version
      shell: bash
      run: |
        # mkudffs has no --version option; it prints its "mkudffs from
        # udftools X.Y" banner and a usage message, then exits nonzero,
        # when run with no device argument.
        out="$(mkudffs 2>&1 || true)"
        echo "$out"
        ver="$(echo "$out" | grep -oE 'udftools [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+' | head -1)"
        major="${ver%%.*}"
        minor="${ver##*.}"
        if [ -z "$ver" ] || [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 3 ]; }; then
          echo "mkudffs version $ver is older than the required 2.3"
          exit 1
        fi

    - name: Build the helper commands and the noahsark binary
      shell: bash
      run: |
        # Built once here, as the normal user, with the normal build
        # cache. The sudo'd test step below uses an isolated cache (root
        # writing into the normal user's cache would need an ownership
        # fix afterward) and picks up these prebuilt binaries instead of
        # `go run`, so it never has to compile anything itself.
        mkdir -p "$RUNNER_TEMP/e2e-tools"
        for name in ci-fixture ci-chain-fixture ci-incremental-fixture ci-list ci-corrupt ci-heal ci-restore ci-disc-uuid ci-disc-field ci-state-count ci-index-count; do
          go build -o "$RUNNER_TEMP/e2e-tools/$name" "./test/e2e/disc/cmd/$name"
        done
        go build -o "$RUNNER_TEMP/e2e-tools/noahsark" ./cmd/noahsark

    - name: "Run scenario: ${{ inputs.cell-name }}"
      shell: bash
      env:
        NOAHSARK_E2E: '1'
        NOAHSARK_E2E_SCENARIO: ${{ inputs.scenario }}
        NOAHSARK_E2E_MEDIA: ${{ inputs.media }}
        NOAHSARK_E2E_ORDER: ${{ inputs.order }}
        NOAHSARK_E2E_EXTRAS: ${{ inputs.extras }}
        CELL_NAME: ${{ inputs.cell-name }}
      run: |
        mkdir -p "$RUNNER_TEMP/e2e-result"
        LOG="$RUNNER_TEMP/e2e-result/log.txt"
        RESULT="$RUNNER_TEMP/e2e-result/result.txt"

        GOTEST_CMD=(env "PATH=$PATH" \
            GOCACHE=/tmp/noahsark-e2e-gocache GOMODCACHE=/tmp/noahsark-e2e-gomodcache \
            NOAHSARK_E2E="$NOAHSARK_E2E" \
            NOAHSARK_E2E_SCENARIO="$NOAHSARK_E2E_SCENARIO" \
            NOAHSARK_E2E_MEDIA="$NOAHSARK_E2E_MEDIA" \
            NOAHSARK_E2E_ORDER="$NOAHSARK_E2E_ORDER" \
            NOAHSARK_E2E_EXTRAS="$NOAHSARK_E2E_EXTRAS" \
            NOAHSARK_E2E_TOOLDIR="$RUNNER_TEMP/e2e-tools" \
            NOAHSARK_E2E_BIN="$RUNNER_TEMP/e2e-tools/noahsark" \
            go test ./test/e2e/disc -v -count=1 -timeout "${{ inputs.go-test-timeout }}")

        MEM_LIMIT_MB="${{ inputs.mem-limit-mb }}"
        mechanism="none"
        if [ -n "$MEM_LIMIT_MB" ]; then
          # Try systemd-run --scope first: it caps the whole process tree
          # by cgroup memory accounting, the mechanism OPERATIONS.md's
          # low-RAM rule is meant to hold under. Probe it with a no-op
          # scope before trusting it for the real run; some runners do
          # not have a usable systemd manager for this.
          if sudo systemd-run --scope -p "MemoryMax=${MEM_LIMIT_MB}M" --same-dir true >/tmp/systemd-run-probe.log 2>&1; then
            mechanism="systemd-run"
            echo "lowmem: capping at ${MEM_LIMIT_MB} MiB via systemd-run --scope MemoryMax=${MEM_LIMIT_MB}M"
          else
            echo "lowmem: systemd-run --scope is not usable on this runner, falling back to prlimit --as:"
            cat /tmp/systemd-run-probe.log || true
            mechanism="prlimit"
            echo "lowmem: capping at ${MEM_LIMIT_MB} MiB via prlimit --as=$((MEM_LIMIT_MB * 1024 * 1024))"
          fi
        fi

        # run_wrapped CMD... runs CMD under whichever memory-limiting
        # mechanism was picked above, or plain sudo -E when mem-limit-mb
        # was not given.
        run_wrapped() {
          case "$mechanism" in
          systemd-run) sudo systemd-run --scope -p "MemoryMax=${MEM_LIMIT_MB}M" --same-dir "$@" ;;
          prlimit) sudo prlimit "--as=$((MEM_LIMIT_MB * 1024 * 1024))" "$@" ;;
          *) sudo -E "$@" ;;
          esac
        }

        # tee's own stdout goes to the runner's log capture pipe, which
        # can hiccup under load; --output-error=warn makes tee warn and
        # keep reading on a write error there instead of exiting. Without
        # it, a dead tee closes its stdin, and the go test process (and,
        # through it, the sudo'd noahsark binary it drives) inherits a
        # broken pipe on fd 1 and can die of SIGPIPE (exit 141) on its
        # next write.
        start=$(date +%s)
        status=pass
        if ! run_wrapped "${GOTEST_CMD[@]}" 2>&1 | tee --output-error=warn "$LOG"; then
          status=fail
        fi

        # The lowmem cell also proves the memory assertion tests
        # (internal/image, internal/restore) hold under the same
        # process-wide cap, not only the disc e2e flow above.
        if [ "${{ inputs.scenario }}" = "lowmem" ]; then
          MEMTEST_CMD=(env "PATH=$PATH" \
              GOCACHE=/tmp/noahsark-e2e-gocache GOMODCACHE=/tmp/noahsark-e2e-gomodcache \
              go test ./internal/image/... ./internal/restore/... -run MemoryBounded -v -count=1 -timeout 15m)
          if ! run_wrapped "${MEMTEST_CMD[@]}" 2>&1 | tee --output-error=warn -a "$LOG"; then
            status=fail
          fi
        fi
        end=$(date +%s)
        echo "$CELL_NAME $status $((end - start))s" | tee "$RESULT"
        [ "$status" = pass ]

    - name: Upload cell result
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/e2e-result/log.txt
          ${{ runner.temp }}/e2e-result/result.txt
        if-no-files-found: warn
